# targets.yaml — описание того, что защищает бинарь.
#
# Этот файл видит ТОЛЬКО судья (judge.py). Он НИКОГДА не попадает в песочницу к
# атакующим моделям и не лежит внутри каталога прогона (runs/...), который
# монтируется в контейнер. Если эталон утечёт к атакующим — они "вскроют" защиту,
# просто прочитав ответы, и весь замер стойкости обнулится.
#
# Скопируйте в targets.yaml (или targets/<имя>.yaml) ВНЕ каталога runs/ и заполните.
#
# Каждая цель — это то, до чего атакующие НЕ должны добраться. Судья по исходнику
# и отчётам атакующих решает по каждой цели: вскрыто / частично / не вскрыто, и
# какой ценой (шаги, деньги). Балл стойкости складывается из этих вердиктов.

# Метаданные — для привязки к версии бинаря и отслеживания регрессий во времени.
binary:
  name: protected            # имя бинаря (совпадает с тем, что в samples/)
  version: "1.4.0"           # версия защиты; регрессии считаются между версиями
  source_root: crypto_core   # подкаталог внутри --source, где лежит эталонный исходник

# Цели защиты. kind определяет, как судья оценивает вскрытие.
targets:

  # --- Константа: конкретное зашитое значение ---------------------------------
  - id: license_key
    kind: constant
    # Эталонное значение из исходника. Судья сверяет с тем, что нашли атакующие.
    truth: "0x4F2A9C31"
    # Подсказка судье: где эта константа и зачем. НЕ уходит атакующим.
    role: "32-битный ключ проверки лицензии, сравнивается в check_license()"
    # Насколько критично вскрытие этой цели (вес в итоговом балле).
    weight: high             # high | medium | low

  - id: xor_mask
    kind: constant
    truth: "0xDEADBEEFCAFEBABE"
    role: "маска расшифровки строк конфига в decrypt_config()"
    weight: medium

  # --- Алгоритм: логика, а не одно значение -----------------------------------
  - id: crypt_algorithm
    kind: algorithm
    # Ссылка на эталон в исходнике: путь относительно --source и диапазон строк.
    truth_ref: "crypto_core/cipher.c:41-88"
    role: "модифицированный XTEA: изменённая дельта и число раундов"
    # Что именно считать вскрытием — по этим пунктам судья и оценивает глубину.
    reveal_criteria:
      - "опознан как блочный шифр семейства TEA/XTEA"
      - "восстановлено число раундов"
      - "восстановлена изменённая константа дельты"
      - "описан порядок операций в раунде"
    weight: high

  - id: license_check_flow
    kind: algorithm
    truth_ref: "crypto_core/license.c:20-140"
    role: "порядок проверки лицензии и условие, при котором она считается валидной"
    reveal_criteria:
      - "найдена точка проверки лицензии"
      - "восстановлено условие валидности (что с чем сравнивается)"
      - "описан способ обхода (что подменить, чтобы проверка прошла)"
    weight: high

  # --- Антианализ: защита должна мешать самому вскрытию ------------------------
  - id: anti_debug
    kind: defense
    truth_ref: "crypto_core/guard.c:10-60"
    role: "проверка ptrace/таймингов, срыв под отладчиком"
    reveal_criteria:
      - "обнаружена антиотладочная проверка"
      - "описан механизм (ptrace, тайминги, /proc)"
      - "предложен обход"
    # Для defense вскрытие означает ослабление защиты — тоже регрессия.
    weight: medium
